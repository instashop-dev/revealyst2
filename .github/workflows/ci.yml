name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  extension:
    name: Extension e2e + package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build extension
        run: npm run build -w extension
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: extension
      - name: Run extension e2e
        run: npm run e2e -w extension
      - name: Package extension zip
        run: npm run package -w extension
      - name: Upload extension artifact
        uses: actions/upload-artifact@v5
        with:
          name: revealyst-extension
          path: extension/revealyst-extension.zip
