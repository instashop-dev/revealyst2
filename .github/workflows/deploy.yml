# Deploy pipeline — Cloudflare Workers API, Cloudflare Pages dashboard,
# RDS provisioning (Terraform), and Vectorize seeding.
#
# GitHub Actions forbids the `secrets` context inside `if` conditions, and the
# `env` context is unreliable for job-level gating. So a `gate` job evaluates
# secret presence in a run step and exposes booleans as job outputs; each
# deploy job is gated on `needs.gate.outputs.*`. Until the corresponding
# credentials exist, the deploy jobs are skipped. Full secret wiring
# (OPENAI_API_KEY, DATABASE_URL, Vectorize namespace) is refined per phase.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "web/**"
      - "vectorize/**"
      - "db/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      cf: ${{ steps.check.outputs.cf }}
      aws: ${{ steps.check.outputs.aws }}
      openai: ${{ steps.check.outputs.openai }}
    steps:
      - id: check
        run: |
          echo "cf=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
          echo "aws=${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && secrets.AWS_REGION != '' }}" >> "$GITHUB_OUTPUT"
          echo "openai=${{ secrets.OPENAI_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

  # --- Cloudflare Workers API -------------------------------------------
  workers:
    needs: gate
    if: ${{ needs.gate.outputs.cf == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy worker
        working-directory: workers
        run: npx wrangler deploy

  # --- Cloudflare Pages dashboard ----------------------------------------
  pages:
    needs: gate
    if: ${{ needs.gate.outputs.cf == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build web app
        working-directory: web
        run: npm run build
      - name: Publish to Cloudflare Pages
        working-directory: web
        run: npx wrangler pages deploy dist --project-name revealyst-web

  # --- RDS provisioning via Terraform (files land in Phase 3) ------------
  rds:
    needs: gate
    if: ${{ needs.gate.outputs.aws == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.x
      # db/terraform lands in Phase 3; skip until then (hashFiles is only
      # allowed in step-level if conditions).
      - name: Terraform init
        if: ${{ hashFiles('db/terraform/**') != '' }}
        working-directory: db/terraform
        run: terraform init
      - name: Terraform apply
        if: ${{ hashFiles('db/terraform/**') != '' }}
        working-directory: db/terraform
        run: terraform apply -auto-approve

  # --- Vectorize namespace + seed (files land in Phase 3) ----------------
  vectorize:
    needs: gate
    if: ${{ needs.gate.outputs.cf == 'true' && needs.gate.outputs.openai == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build vectorize package
        working-directory: vectorize
        run: npm run build
      - name: Seed Vectorize namespace
        working-directory: vectorize
        run: npm run seed
