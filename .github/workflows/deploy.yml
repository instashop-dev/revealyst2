# Deploy pipeline — Cloudflare Workers API, Cloudflare Pages dashboard,
# AWS RDS provisioning, and Vectorize seeding.
#
# GitHub Actions forbids the `secrets` context inside `if` conditions, so a
# `gate` job evaluates secret presence and exposes booleans as job outputs;
# each deploy job is gated on `needs.gate.outputs.*`.
#
# The rds job provisions the RDS instance with the AWS CLI (idempotent; the
# password lives in AWS Secrets Manager — this repo is public, so no
# Terraform state file with secrets is committed). db/terraform/main.tf is the
# equivalent reference IaC for a private backend.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "web/**"
      - "vectorize/**"
      - "db/**"
      - "ml/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      cf: ${{ steps.check.outputs.cf }}
      aws: ${{ steps.check.outputs.aws }}
      openai: ${{ steps.check.outputs.openai }}
      db: ${{ steps.check.outputs.db }}
    steps:
      - id: check
        run: |
          echo "cf=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
          echo "aws=${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && secrets.AWS_REGION != '' }}" >> "$GITHUB_OUTPUT"
          echo "openai=${{ secrets.OPENAI_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
          echo "db=${{ secrets.DATABASE_URL != '' }}" >> "$GITHUB_OUTPUT"

  # --- Cloudflare Workers API (after Vectorize so the binding exists) ---
  workers:
    needs: [gate, vectorize]
    if: ${{ needs.gate.outputs.cf == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy worker
        if: ${{ hashFiles('workers/wrangler.toml') != '' }}
        working-directory: workers
        run: npx wrangler deploy
      - name: Set API secrets
        if: ${{ hashFiles('workers/wrangler.toml') != '' }}
        working-directory: workers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LIBRARY_ENC_KEY: ${{ secrets.LIBRARY_ENC_KEY }}
          SES_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID }}
          SES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          echo "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
          echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
          echo "$LIBRARY_ENC_KEY" | npx wrangler secret put LIBRARY_ENC_KEY
          if [ -n "$SES_ACCESS_KEY_ID" ]; then
            echo "$SES_ACCESS_KEY_ID" | npx wrangler secret put SES_ACCESS_KEY_ID
            echo "$SES_SECRET_ACCESS_KEY" | npx wrangler secret put SES_SECRET_ACCESS_KEY
            echo "SES secrets set (magic-link email live)"
          else
            echo "SES secrets absent — magic-link email will 500 until configured"
          fi
          if [ -n "$ADMIN_EMAILS" ]; then
            echo "$ADMIN_EMAILS" | npx wrangler secret put ADMIN_EMAILS
            echo "ADMIN_EMAILS secret set (app-creator admin live)"
          else
            echo "ADMIN_EMAILS secret absent — /api/admin/* disabled until configured"
          fi
      - name: Print live URL
        if: ${{ hashFiles('workers/wrangler.toml') != '' }}
        working-directory: workers
        run: |
          URL=$(npx wrangler deployments list 2>/dev/null | grep -oE 'https://[a-z0-9-]+\.workers\.dev' | head -1 || true)
          echo "WORKER_URL=$URL"
          if [ -n "$URL" ]; then
            curl -sf --max-time 20 "$URL/api/health" && echo " → health OK" || echo "health check failed (worker may still be warming up)"
          fi

  # --- Database: migrations + worker secrets ----------------------------
  # Uses the user-provisioned DATABASE_URL secret when present; otherwise
  # attempts automated RDS provisioning (requires a widened IAM policy).
  rds:
    needs: [gate, workers]
    if: ${{ needs.gate.outputs.aws == 'true' || needs.gate.outputs.db == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      LIBRARY_ENC_KEY: ${{ secrets.LIBRARY_ENC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve database connection and provision RDS if needed
        run: |
          set -euo pipefail
          if [ -n "$DATABASE_URL" ]; then
            echo "Using user-provided DATABASE_URL (manual provisioning)"
          else            # Automated provisioning — requires rds:CreateDBInstance etc.
            # Deterministic, stable master password derived (HMAC-SHA256) from
            # the stable JWT_SECRET GitHub secret.
            PASSWORD=$(node -e "
              const c = require('crypto');
              const base = process.env.PASSWORD_BASE || '';
              console.log(c.createHmac('sha256', base).update('revealyst-db-password-v1').digest('base64').slice(0, 32));
            ")
            ENDPOINT=$(aws rds describe-db-instances --db-instance-identifier revealyst \
              --query 'DBInstances[0].Endpoint.Address' --output text 2>/dev/null || true)
            if [ -z "$ENDPOINT" ] || [ "$ENDPOINT" = "None" ]; then
              aws rds create-db-instance \
                --db-instance-identifier revealyst \
                --engine postgres --engine-version 15.7 \
                --db-instance-class db.t3.micro --allocated-storage 20 \
                --master-username revealyst --master-user-password "$PASSWORD" \
                --db-name revealyst --publicly-accessible \
                --backup-retention-period 7 --storage-encrypted \
                --deletion-protection --tags Key=Service,Value=revealyst
              echo "RDS instance provisioning — this takes several minutes..."
              aws rds wait db-instance-available --db-instance-identifier revealyst
              ENDPOINT=$(aws rds describe-db-instances --db-instance-identifier revealyst \
                --query 'DBInstances[0].Endpoint.Address' --output text)
            fi
            ENC_PW=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PASSWORD")
            DATABASE_URL="postgres://revealyst:${ENC_PW}@${ENDPOINT}:5432/revealyst"
            echo "RDS endpoint: $ENDPOINT"
          fi
          # Persist DATABASE_URL safely (heredoc format handles special chars).
          {
            echo "DATABASE_URL<<EOF"
            echo "$DATABASE_URL"
            echo "EOF"
          } >> "$GITHUB_ENV"
          # Diagnostic: print host/port/db only (password stays masked by GH).
          node -e "
            const u = new URL(process.env.DATABASE_URL);
            console.log('DB diagnostic -> host:', u.hostname, '| port:', u.port, '| db:', u.pathname.slice(1));
          "
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PASSWORD_BASE: ${{ secrets.JWT_SECRET }}
      - name: Run migrations
        run: |
          npm run build -w db
          node db/dist/run-migrations.js
      - name: Set worker database secret
        run: |
          echo "$DATABASE_URL" | npx wrangler secret put DATABASE_URL --config workers/wrangler.toml
      - name: Ensure Hyperdrive config (AWS RDS)
        run: |
          set -euo pipefail
          # The live config is revealyst-rds (id pinned in workers/wrangler.toml).
          # Stale configs from the early Neon/Supabase experiments are deleted
          # every deploy (tolerate "not found").
          for c in revealyst-neon revealyst-pooler revealyst-pooler-2; do
            npx wrangler hyperdrive delete "$c" 2>&1 | grep -ivE 'not found|does not exist|no hyperdrive|✘' || true
          done
          # Ensure the pinned config exists and points at the current DB.
          # `create` is a no-op (code 2017) when the name already exists.
          npx wrangler hyperdrive create revealyst-rds --connection-string="$DATABASE_URL" 2>&1 | grep -v 'already exists' || true
          # Fail fast if the id pinned in wrangler.toml vanished (e.g. the
          # config was recreated under a new id) — deploying would otherwise
          # point the worker at a stale/nonexistent config.
          if ! npx wrangler hyperdrive list 2>/dev/null | grep -q '1ed0eec907c544189c090fb940c111c9'; then
            echo "ERROR: Hyperdrive id 1ed0eec907c544189c090fb940c111c9 (pinned in workers/wrangler.toml) is missing — recreate revealyst-rds and repin the id." >&2
            exit 1
          fi

  # --- Full-stack journey e2e (real RDS + Vectorize + OpenAI) -----------------
  # Runs the complete authenticated user journey (auth → events → stats →
  # team lifecycle → library) against a LOCAL `wrangler dev` worker wired to
  # the deployed infrastructure. DEV_MODE returns magic links directly, so the
  # whole auth round trip is testable without an inbox. Test rows are removed
  # by the script itself.
  journey:
    needs: [gate, rds]
    if: ${{ needs.gate.outputs.cf == 'true' && needs.gate.outputs.db == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare local worker env (.dev.vars)
        working-directory: workers
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LIBRARY_ENC_KEY: ${{ secrets.LIBRARY_ENC_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > .dev.vars <<EOF
          DATABASE_URL=$DATABASE_URL
          CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
          JWT_SECRET=$JWT_SECRET
          LIBRARY_ENC_KEY=$LIBRARY_ENC_KEY
          OPENAI_API_KEY=$OPENAI_API_KEY
          APP_URL=http://127.0.0.1:8788
          VECTORIZE_NAMESPACE=prompt-patterns
          DEV_MODE=true
          RATE_LIMIT_DISABLED=true
          EOF
      - name: Start local worker (real RDS via Hyperdrive emulation)
        working-directory: workers
        run: |
          set -euo pipefail
          # RDS requires TLS; wrangler's Hyperdrive emulation connects without
          # it by default, so pin sslmode=require on the emulated string.
          export CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE="${DATABASE_URL}?sslmode=require"
          npx wrangler dev --port 8788 --ip 127.0.0.1 > /tmp/wrangler-dev.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for i in $(seq 1 40); do
            if curl -sf --max-time 5 http://127.0.0.1:8788/api/health >/dev/null 2>&1; then
              echo "local worker ready (${i} tries)"
              break
            fi
            sleep 3
          done
          curl -sf --max-time 20 "http://127.0.0.1:8788/api/health?db=1" && echo " ← DB round-trip ok"
      - name: Run full journey e2e
        run: node e2e/journey.mjs
      - name: Stop local worker
        if: always()
        run: kill "$(cat /tmp/wrangler.pid)" 2>/dev/null || true

  # --- Cloudflare Pages dashboard ----------------------------------------
  pages:
    needs: gate
    if: ${{ needs.gate.outputs.cf == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build web app
        working-directory: web
        run: npm run build
      - name: Ensure Pages project exists
        if: ${{ hashFiles('web/index.html') != '' }}
        working-directory: web
        run: npx wrangler pages project create revealyst-web --production-branch main || true
      - name: Publish to Cloudflare Pages
        if: ${{ hashFiles('web/index.html') != '' }}
        working-directory: web
        run: npx wrangler pages deploy dist --project-name revealyst-web

  # --- Live integration smoke (after Workers + Pages are live) --------------
  # Exercises the deployed API + dashboard exactly like a user: health,
  # OpenAPI, auth shape, magic link, and SPA fallback.
  smoke:
    needs: [gate, workers, pages]
    if: ${{ needs.gate.outputs.cf == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_API_URL: https://revealyst-workers.thapi.workers.dev
      E2E_WEB_URL: https://revealyst-web.pages.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run live API + web smoke
        run: node e2e/api-smoke.mjs

  # --- ONNX prompt-scorer artifact -> R2 (loaded by the extension) ----------
  # Uploads the trained int8 model + tokenizer + head to the `revealyst-models`
  # R2 bucket. Public access + the pub-<hash>.r2.dev URL are a one-time
  # dashboard step (docs/runbook.md); the extension falls back to rules until
  # MODEL_BASE_URL points at the bucket.
  models:
    needs: gate
    if: ${{ needs.gate.outputs.cf == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ensure R2 bucket exists
        run: npx wrangler r2 bucket create revealyst-models || true
      - name: Upload prompt-scorer-v1 artifact
        run: node ml/scripts/upload.mjs

  # --- Vectorize namespace + seed ----------------------------------------
  vectorize:
    needs: gate
    if: ${{ needs.gate.outputs.cf == 'true' && needs.gate.outputs.openai == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ensure namespace exists
        if: ${{ hashFiles('vectorize/src/seed.ts') != '' }}
        working-directory: vectorize
        run: npx wrangler vectorize create prompt-patterns --dimensions=1536 --metric=cosine || true
      - name: Build vectorize package
        working-directory: vectorize
        run: npm run build
      - name: Seed Vectorize namespace
        if: ${{ hashFiles('vectorize/src/seed.ts') != '' }}
        working-directory: vectorize
        run: npm run seed
