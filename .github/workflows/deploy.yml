# Deploy pipeline — Cloudflare Workers API, Cloudflare Pages dashboard,
# RDS provisioning (Terraform), and Vectorize seeding.
#
# Every deploy step is gated on the presence of its required secrets via
# job-level env + step-level `if: env.X != ''` (the `secrets` context is not
# allowed in `if` conditions). Until the corresponding credentials exist, the
# deploy steps are skipped. Full secret wiring (OPENAI_API_KEY, DATABASE_URL,
# Vectorize namespace) is refined per phase.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "web/**"
      - "vectorize/**"
      - "db/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # --- Cloudflare Workers API -------------------------------------------
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        working-directory: workers
        run: npx wrangler deploy

  # --- Cloudflare Pages dashboard ----------------------------------------
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build web app
        working-directory: web
        run: npm run build
      - name: Publish to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        working-directory: web
        run: npx wrangler pages deploy dist --project-name revealyst-web

  # --- RDS provisioning via Terraform (files land in Phase 3) ------------
  rds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.x
      - name: Terraform init
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_REGION != '' && hashFiles('db/terraform/**') != '' }}
        working-directory: db/terraform
        run: terraform init
      - name: Terraform apply
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_REGION != '' && hashFiles('db/terraform/**') != '' }}
        working-directory: db/terraform
        run: terraform apply -auto-approve

  # --- Vectorize namespace + seed (files land in Phase 3) ----------------
  vectorize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build vectorize package
        working-directory: vectorize
        run: npm run build
      - name: Seed Vectorize namespace
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.OPENAI_API_KEY != '' }}
        working-directory: vectorize
        run: npm run seed
