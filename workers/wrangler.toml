name = "revealyst-workers"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# RDS PostgreSQL access from the Worker (postgres.js over TCP).
# Hyperdrive proxies the AWS RDS instance; the Worker connects over
# Cloudflare's network (no direct TCP egress needed). If the binding is
# removed, db.ts falls back to DATABASE_URL.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "1ed0eec907c544189c090fb940c111c9"

[[vectorize]]
binding = "VECTORIZE"
index_name = "prompt-patterns"
# Use the remote index in `wrangler dev` too — local dev (and the CI journey
# e2e) otherwise falls back to static suggestions and never exercises the
# spec §5.3 vectorize+llm pipeline.
remote = true

# ONNX prompt-scorer artifacts (spec §5.2) — served publicly by GET /models/*.
[[r2_buckets]]
binding = "MODELS"
bucket_name = "revealyst-models"

[observability]
enabled = true

# Non-secret vars — real values come from the deployment workflow / .dev.vars.
[vars]
APP_URL = "https://revealyst-web.pages.dev"
VECTORIZE_NAMESPACE = "prompt-patterns"
DEV_MODE = "false"
RATE_LIMIT_DISABLED = "false"

# Secrets (set via `wrangler secret put` or the deploy workflow):
#   OPENAI_API_KEY, JWT_SECRET, DATABASE_URL, LIBRARY_ENC_KEY,
#   SES_ACCESS_KEY_ID, SES_SECRET_ACCESS_KEY, ADMIN_EMAILS
# ADMIN_EMAILS (comma-separated app-creator emails) is a Worker secret —
# keep it out of [vars] so it cannot shadow the deployed secret.

# AWS SES — transactional email for magic links (identity: revealyst.com,
# sending via the e.revealyst.com subdomain). SES_REGION / SES_FROM_EMAIL are
# non-secret vars; the access keys are Worker secrets.
SES_REGION = "us-east-1"
SES_FROM_EMAIL = "Revealyst <noreply@e.revealyst.com>"

# Weekly manager digest (spec §4 north-star/retention): Monday 08:00 UTC.
[triggers]
crons = ["0 8 * * 1"]
